---
deployment:
  tasks:
    - export APP_PATH=/home/reaf9419/readymix-app/
    - export WEB_PATH=/home/reaf9419/public_html/
    
    # 1. Buat folder tujuan luar jika belum ada
    - /bin/mkdir -p $APP_PATH
    
    # 2. Salin folder inti Laravel yang ADA DI GIT ke folder luar
    - /bin/cp -R app $APP_PATH
    - /bin/cp -R bootstrap $APP_PATH
    - /bin/cp -R config $APP_PATH
    - /bin/cp -R database $APP_PATH
    - /bin/cp -R resources $APP_PATH
    - /bin/cp -R routes $APP_PATH
    - /bin/cp -R storage $APP_PATH
    
    # PERHATIAN: Baris cp vendor dan .env dihapus karena file tersebut 
    # di-ignore oleh Git sehingga tidak ada di cPanel saat di-pull.
    # Jika dipaksa disalin, script cPanel Git akan CRASH/ERROR.
    
    # 3. Salin HANYA file yang ADA DI GIT dari folder public ke public_html
    - /bin/cp public/index.php $WEB_PATH
    - /bin/cp public/.htaccess $WEB_PATH
    - /bin/cp public/robots.txt $WEB_PATH
    - /bin/cp public/*.ico $WEB_PATH
    - /bin/cp public/*.png $WEB_PATH
    - /bin/cp public/*.webp $WEB_PATH
    - /bin/cp public/*.svg $WEB_PATH
    - /bin/cp public/*.xml $WEB_PATH
    - /bin/cp public/*.webmanifest $WEB_PATH
    
    # PERHATIAN: public/build dihapus dari script karena di-ignore oleh Git.
